<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
<style>
.container{
    background-color: dodgerblue;
    height: 650px;
    display: flex;
    flex-direction:row; /* row is default value */
    justify-content:space-around; /* always works with main axis */
    align-items:flex-start; /* always works with cross axis */
    flex-wrap:wrap; /* by default it is nowrap */

}

.item{
    background-color:coral;
    height: 150px;
    width: 150px;
    margin: 10px;
}





</style>


</head>
<body>
<div class="container">
   <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
      <div class="item"></div>
     

</div>



    
</body>
</html>
